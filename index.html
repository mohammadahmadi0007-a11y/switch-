<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SWITCH PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Arial,Tahoma,sans-serif}
html,body{width:100%;height:100%;background:#0b1120;color:#0f172a;overflow:hidden}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;background:#ffffff;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:0;left:0;right:0;height:52px;background:rgba(255,255,255,.96);border-bottom:1px solid rgba(15,23,42,.08);padding:0 14px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.hud-left{font-size:13px;color:#0f172a;font-weight:700;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:10px}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:34px;height:34px;border-radius:50%;background:#f1f5f9;border:1px solid #cbd5e1;color:#0f172a;font-size:14px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.icon-btn:active{transform:scale(.92)}
.overlay{position:absolute;inset:0;background:rgba(255,255,255,.96);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;z-index:25;overflow-y:auto}
#start-screen{background:rgba(255,255,255,.82)}
#over-screen{background:rgba(255,255,255,.92)}
.hd{display:none!important}
.logo{font-size:32px;font-weight:900;color:#0f172a;margin-bottom:6px;letter-spacing:1px}
.logo span{color:#ef4444}
.sub{font-size:12px;color:#475569;margin-bottom:14px;text-align:center}
.card{width:100%;max-width:350px;background:#ffffff;border:1.5px solid #e2e8f0;border-radius:18px;padding:12px;margin-bottom:14px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.card-title{font-size:13px;font-weight:700;color:#0284c7;margin-bottom:8px;display:flex;justify-content:space-between}
.lb-list{max-height:165px;overflow-y:auto}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:10px;margin-bottom:5px;background:#f8fafc;font-size:13px;color:#0f172a}
.lb-row.me{background:rgba(2,132,199,.12);border:1px solid #0284c7}
.lb-user{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.av{width:28px;height:28px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.lb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.btn{width:100%;max-width:350px;padding:13px;border:none;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;margin-bottom:9px}
.btn:active{transform:scale(.97)}
.btn-play{background:linear-gradient(135deg,#0ea5e9,#0284c7);color:#fff;box-shadow:0 4px 14px rgba(2,132,199,.3)}
.btn-shop{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;box-shadow:0 4px 14px rgba(217,119,6,.25)}
.btn-share{background:#f1f5f9;color:#0f172a;font-size:13px;border:1px solid #cbd5e1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:350px;margin-bottom:12px}
.stat{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:10px;text-align:center}
.skins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:350px;margin-bottom:14px}
.sk-item{background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer}
.sk-item:active{transform:scale(.95)}
.sk-item.active{border-color:#0284c7;background:rgba(2,132,199,.1)}
.sk-dot{width:28px;height:28px;border-radius:50%;margin:0 auto 6px}
.brand-tag{margin-top:6px;padding:6px 14px;border-radius:20px;background:#f8fafc;border:1px solid #e2e8f0;font-size:11px;color:#64748b;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.brand-tag b{color:#0284c7;direction:ltr}
#toast{position:absolute;top:62px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:7px 15px;border-radius:11px;font-size:12px;font-weight:700;z-index:50;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
<div id="toast"></div>
<div class="hud">
<div class="hud-left" onclick="openMenu()"><span>🏆 <span id="hud-best">0</span></span><span style="color:#d97706">⭐ <span id="hud-stars">0</span></span></div>
<div style="font-size:13px;font-weight:900;color:#0284c7;letter-spacing:1px">SWITCH</div>
<div class="hud-btns">
<button class="icon-btn" id="btn-snd" onclick="toggleSound()">🔊</button>
<button class="icon-btn" id="btn-pause" onclick="togglePause()">⏸</button>
</div>
</div>

<canvas id="cv"></canvas>

<div class="overlay" id="start-screen">
<div class="logo">⚡ SWITCH<span>!</span></div>
<div class="sub">با ضربه زدن بین دیوارهای آبی جابه‌جا شو، ستاره بگیر و از موانع بگریز!</div>
<div class="card">
<div class="card-title"><span>🏆 برترین رکوردهای بازیکنان</span><span id="my-rank" style="color:#0f172a;font-size:11px"></span></div>
<div class="lb-list" id="lb-start">در حال دریافت...</div>
</div>
<button class="btn btn-play" onclick="startGame()">شروع بازی</button>
<button class="btn btn-shop" onclick="openShop('start')">🛒 فروشگاه رنگ توپ‌ها (⭐ <span id="menu-stars">0</span>)</button>
<div class="brand-tag" onclick="openChannel()">🎮 اختصاصی کانال <b>@gamee_balee</b></div>
</div>

<div class="overlay hd" id="shop-screen">
<div class="logo" style="font-size:24px">🛒 فروشگاه توپ‌ها</div>
<div class="sub">موجودی ستاره شما: <b style="color:#d97706" id="shop-stars">0</b> ⭐</div>
<div class="skins-grid" id="skins-grid"></div>
<button class="btn btn-play" onclick="closeShop()">بازگشت</button>
</div>

<div class="overlay hd" id="pause-screen">
<div class="logo" style="color:#0284c7">توقف بازی</div>
<button class="btn btn-play" onclick="togglePause()">▶️ ادامه بازی</button>
<button class="btn btn-share" onclick="openMenu()">🏠 منو و رده‌بندی</button>
</div>

<div class="overlay hd" id="over-screen">
<div class="logo" style="color:#ef4444">GAME OVER</div>
<div class="stats">
<div class="stat"><div style="font-size:24px;font-weight:900;color:#0284c7" id="end-score">0</div><div style="font-size:11px;color:#64748b">امتیاز</div></div>
<div class="stat"><div style="font-size:24px;font-weight:900;color:#16a34a" id="end-best">0</div><div style="font-size:11px;color:#64748b">رکورد شما</div></div>
</div>
<div class="card">
<div class="card-title"><span>🏆 جدول نفرات برتر</span></div>
<div class="lb-list" id="lb-over"></div>
</div>
<button class="btn btn-play" onclick="startGame()">🔄 بازی مجدد</button>
<button class="btn btn-shop" onclick="openShop('over')">🛒 فروشگاه رنگ توپ‌ها (⭐ <span id="over-stars">0</span>)</button>
<button class="btn btn-share" onclick="shareScore()">📤 کل‌کل و ارسال رکورد</button>
<div class="brand-tag" onclick="openChannel()">🎮 اختصاصی کانال <b>@gamee_balee</b></div>
</div>
</div>

<script>
const DB="https://kido-db.mohammadahmadi0007.workers.dev/switch_lb.json";
const BOT_LINK="https://ble.ir/switch_game_bot";
const CHANNEL_ID="@gamee_balee";
const CHANNEL_URL="https://ble.ir/gamee_balee";

function openChannel(){
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink)Bale.WebApp.openLink(CHANNEL_URL);
else window.open(CHANNEL_URL,"_blank");
}

let savedUid=null;
try{
  savedUid=localStorage.getItem("game_global_uid");
  if(!savedUid){
    savedUid="u_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    localStorage.setItem("game_global_uid",savedUid);
  }
}catch(e){
  savedUid="u_"+Math.floor(1e5+Math.random()*9e5);
}

let usr={id:savedUid,name:"بازیکن مهمان",photo:""};
try{
  usr.name=localStorage.getItem("game_global_name")||"بازیکن مهمان";
  usr.photo=localStorage.getItem("game_global_photo")||"";
}catch(e){}

function detectBaleUser(){
  try{
    const raw=(location.hash||"")+"&"+(location.search||"");
    const m=raw.match(/(?:tgWebAppData|baleWebAppData)=([^&]+)/);
    let u=null;
    if(m&&m[1])u=JSON.parse(new URLSearchParams(decodeURIComponent(m[1])).get("user"));
    if(window.Bale&&Bale.WebApp){
      Bale.WebApp.ready();
      Bale.WebApp.expand();
      if(Bale.WebApp.initDataUnsafe&&Bale.WebApp.initDataUnsafe.user)u=Bale.WebApp.initDataUnsafe.user;
    }
    if(u&&u.id){
      usr.id="b_"+u.id;
      const fullName=[u.first_name,u.last_name].filter(Boolean).join(" ").trim();
      if(fullName)usr.name=fullName;
      if(u.photo_url)usr.photo=u.photo_url;
      try{
        localStorage.setItem("game_global_uid",usr.id);
        localStorage.setItem("game_global_name",usr.name);
        if(usr.photo)localStorage.setItem("game_global_photo",usr.photo);
      }catch(e){}
    }
  }catch(e){}
}
detectBaleUser();

const GRADS=["linear-gradient(135deg,#06b6d4,#3b82f6)","linear-gradient(135deg,#ec4899,#8b5cf6)","linear-gradient(135deg,#f59e0b,#ef4444)","linear-gradient(135deg,#10b981,#059669)","linear-gradient(135deg,#6366f1,#a855f7)"];
function avHtml(p){
let s=0;for(let i=0;i<p.id.length;i++)s+=p.id.charCodeAt(i);
const bg=GRADS[s%GRADS.length],ch=(p.name||"؟").trim().charAt(0);
return p.photo?`<div class="av" style="background:${bg}"><img src="${p.photo}" onerror="this.parentNode.innerText='${ch}'"></div>`:`<div class="av" style="background:${bg}">${ch}</div>`;
}

let best=0,stars=0,owned=[0],curSkin=0;
try{
  best=parseInt(localStorage.getItem("sw_best")||"0",10)||0;
  stars=parseInt(localStorage.getItem("sw_stars")||"0",10)||0;
  owned=JSON.parse(localStorage.getItem("sw_owned")||"[0]");
  curSkin=parseInt(localStorage.getItem("sw_skin")||"0",10)||0;
}catch(e){}
let shopOrigin="start";
let lb=[];

const SKINS=[
{name:"کلاسیک",cost:0,core:"#09090b",glow:"#ef4444"},
{name:"فیروزه",cost:15,core:"#0891b2",glow:"#22d3ee"},
{name:"بنفش",cost:30,core:"#581c87",glow:"#c084fc"},
{name:"آتشین",cost:50,core:"#991b1b",glow:"#f97316"},
{name:"زمرد",cost:75,core:"#065f46",glow:"#34d399"},
{name:"طلایی",cost:100,core:"#1e293b",glow:"#facc15"}
];

function updStars(){
try{localStorage.setItem("sw_stars",stars);}catch(e){}
document.getElementById("hud-stars").innerText=stars;
document.getElementById("menu-stars").innerText=stars;
document.getElementById("over-stars").innerText=stars;
document.getElementById("shop-stars").innerText=stars;
}
updStars();
document.getElementById("hud-best").innerText=best;
function toast(m){const t=document.getElementById("toast");t.innerText=m;t.style.opacity="1";setTimeout(()=>t.style.opacity="0",2000)}

function openShop(from="start"){
shopOrigin=from;
renderShop();
document.getElementById("shop-screen").classList.remove("hd");
}
function closeShop(){
document.getElementById("shop-screen").classList.add("hd");
if(shopOrigin==="over"){
document.getElementById("over-screen").classList.remove("hd");
}
}
function renderShop(){
updStars();
document.getElementById("skins-grid").innerHTML=SKINS.map((sk,i)=>{
const ok=owned.includes(i),act=curSkin===i;
return `<div class="sk-item ${act?'active':''}" onclick="pickSkin(${i})">
<div class="sk-dot" style="background:${sk.core};box-shadow:0 0 10px ${sk.glow}"></div>
<div style="font-size:12px;font-weight:700;margin-bottom:3px">${sk.name}</div>
<div style="font-size:11px;color:${act?'#0284c7':ok?'#16a34a':'#d97706'}">${act?'فعال ✅':ok?'انتخاب':sk.cost+' ⭐'}</div>
</div>`;
}).join("");
}
function pickSkin(i){
if(owned.includes(i)){curSkin=i;try{localStorage.setItem("sw_skin",i);}catch(e){}beep(620,.08);renderShop();toast("توپ "+SKINS[i].name+" فعال شد!")}
else if(stars>=SKINS[i].cost){
stars-=SKINS[i].cost;owned.push(i);curSkin=i;
try{localStorage.setItem("sw_owned",JSON.stringify(owned));localStorage.setItem("sw_skin",i);}catch(e){}
beep(800,.15);renderShop();toast("توپ "+SKINS[i].name+" خریداری شد!");
}else toast("ستاره کافی نداری! ⭐");
}

async function syncLB(sc){
detectBaleUser();
try{
const r=await fetch(DB+"?t="+Date.now());
let d=await r.json();
if(!Array.isArray(d))d=[];
const map=new Map();
for(const item of d){
  if(!item||!item.id)continue;
  if(!map.has(item.id)||item.score>map.get(item.id).score)map.set(item.id,item);
}
d=Array.from(map.values());
const finalScore=Math.max(sc||0,best);
const i=d.findIndex(x=>x.id===usr.id);
let changed=false;
if(i>-1){
  if(finalScore>d[i].score){d[i].score=finalScore;changed=true;}
  if(usr.name!=="بازیکن مهمان"&&d[i].name!==usr.name){d[i].name=usr.name;changed=true;}
  if(usr.photo&&d[i].photo!==usr.photo){d[i].photo=usr.photo;changed=true;}
  if(d[i].score>best){best=d[i].score;try{localStorage.setItem("sw_best",best);}catch(e){}}
}else if(finalScore>0){
  d.push({id:usr.id,name:usr.name,photo:usr.photo,score:finalScore});
  changed=true;
}
d.sort((a,b)=>b.score-a.score);
d=d.slice(0,25);
lb=d;
if(changed){
  await fetch(DB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
}
}catch(e){}
document.getElementById("hud-best").innerText=best;
const rk=lb.findIndex(x=>x.id===usr.id);
document.getElementById("my-rank").innerText=rk>-1?`رتبه شما: #${rk+1}`:"";
const h=lb.length?lb.slice(0,10).map((p,idx)=>`<div class="lb-row ${p.id===usr.id?'me':''}"><div class="lb-user"><span style="width:22px;font-weight:900">${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'#'+(idx+1)}</span>${avHtml(p)}<span class="lb-name">${p.name}</span></div><strong style="color:#0284c7;margin-right:6px">${p.score}</strong></div>`).join(""):"<div style='text-align:center;color:#64748b;font-size:12px;padding:10px'>اولین نفر باش و رکورد بزن!</div>";
document.getElementById("lb-start").innerHTML=h;document.getElementById("lb-over").innerHTML=h;
}

let snd=true,ac=null,nextNoteTime=0,beatStep=0,bgmRunning=false;
const BASS=[130.8,130.8,164.8,146.8,130.8,130.8,196.0,164.8];
const LEAD=[523.2,0,659.2,784.0,659.2,0,587.3,523.2];

function initAudio(){
try{
if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
if(ac.state==="suspended")ac.resume().catch(()=>{});
}catch(e){}
}
function beepAt(f,d,t,v,when){
if(!snd||document.hidden||!ac)return;
try{
const o=ac.createOscillator(),g=ac.createGain();
o.type=t;o.frequency.value=f;
g.gain.setValueAtTime(v,when);
g.gain.exponentialRampToValueAtTime(.001,when+d);
o.connect(g);g.connect(ac.destination);o.start(when);o.stop(when+d);
}catch(e){}
}
function beep(f,d,t="sine",v=0.12){
if(!snd||document.hidden)return;
initAudio();
if(ac)beepAt(f,d,t,v,ac.currentTime);
}
function startBGM(){
if(!snd||document.hidden)return;
initAudio();
if(!ac)return;
bgmRunning=true;
nextNoteTime=ac.currentTime+0.05;
}
function stopBGM(){bgmRunning=false}
function updateBGM(){
if(!bgmRunning||!snd||st!=="play"||document.hidden||!ac)return;
while(nextNoteTime<ac.currentTime+0.15){
const b=BASS[beatStep%8],l=LEAD[beatStep%8];
beepAt(b,0.14,"triangle",0.04,nextNoteTime);
if(l>0&&beatStep%2===0)beepAt(l,0.12,"sine",0.025,nextNoteTime);
nextNoteTime+=0.19;
beatStep++;
}
}
function toggleSound(){
snd=!snd;
document.getElementById("btn-snd").innerText=snd?"🔊":"🔇";
if(snd&&st==="play"&&!document.hidden)startBGM();else stopBGM();
}

function onVisChange(){
if(document.hidden){
stopBGM();
if(ac&&ac.state==="running")ac.suspend().catch(()=>{});
}else{
lastT=0;
if(snd&&st==="play"){
if(ac&&ac.state==="suspended")ac.resume().catch(()=>{});
startBGM();
}
}
}
document.addEventListener("visibilitychange",onVisChange);
window.addEventListener("pagehide",()=>{stopBGM();if(ac&&ac.state==="running")ac.suspend().catch(()=>{})});

const cv=document.getElementById("cv"),ctx=cv.getContext("2d",{alpha:false});
let W=360,H=640,DPR=1,WALL=14,BALL_R=14,BALL_Y=450;

function resize(){
W=Math.max(260,window.innerWidth>480?480:window.innerWidth);
H=Math.max(360,window.innerHeight);
DPR=Math.min(2.5,window.devicePixelRatio||1);
cv.width=Math.round(W*DPR);
cv.height=Math.round(H*DPR);
ctx.setTransform(DPR,0,0,DPR,0,0);
BALL_Y=H*0.72;
}
window.addEventListener("resize",resize);
resize();

let st="menu",score=0,side=0,ballX=WALL+BALL_R,targetX=WALL+BALL_R,switching=false;
let trails=[],bars=[],greens=[],starsList=[],particles=[],floats=[];
let shake=0,spawnGap=0,stepCount=0,lastSide=-1,dustTimer=0,trailStampTimer=0,lastT=0;

function resetGameState(){
side=0;
ballX=WALL+BALL_R;
targetX=WALL+BALL_R;
switching=false;
trails=[];
bars=[];
greens=[];
starsList=[];
particles=[];
floats=[];
shake=0;
spawnGap=110;
stepCount=0;
lastSide=-1;
dustTimer=0;
trailStampTimer=0;
}
resetGameState();

function getFallSpeed(currentScore){
const baseSpeed=302;
const gradualBoost=Math.pow(Math.max(0,currentScore),0.78)*4.5;
return baseSpeed+Math.min(205,gradualBoost);
}

function pickBarWidth(playWidth){
const roll=Math.random();
if(roll<0.32)return playWidth*(0.22+Math.random()*0.12);
if(roll<0.72)return playWidth*(0.36+Math.random()*0.16);
return playWidth*(0.54+Math.random()*0.14);
}

function isSafeGreenSpot(gx,gy,size){
const leftRail=WALL+BALL_R;
const rightRail=W-WALL-BALL_R;
const clearRadius=size/2+BALL_R+12;

if(Math.abs(gx-leftRail)<clearRadius||Math.abs(gx-rightRail)<clearRadius){
return false;
}
for(const g of greens){
if(Math.abs(gy-g.y)<175)return false;
if(Math.hypot(gx-g.x,gy-g.y)<95)return false;
}
for(const b of bars){
const nearY=Math.abs(gy-(b.y+b.h/2))<64;
const overBar=gx+size/2+10>b.x&&gx-size/2-10<b.x+b.w;
if(nearY&&overBar)return false;
}
for(const s of starsList){
if(Math.hypot(gx-s.x,gy-s.y)<54)return false;
}
return true;
}

function spawnNextWave(){
stepCount++;
const leftEdge=WALL;
const rightEdge=W-WALL;
const playWidth=rightEdge-leftEdge;
const barH=20;

let fromLeft;
if(lastSide===-1){
fromLeft=Math.random()>0.5;
}else if(Math.random()<0.68){
fromLeft=(lastSide===0);
}else{
fromLeft=(lastSide===1);
}
lastSide=fromLeft?1:0;

const barW=pickBarWidth(playWidth);
const barY=-28;

if(fromLeft){
bars.push({x:leftEdge,y:barY,w:barW,h:barH,passed:false});
}else{
bars.push({x:rightEdge-barW,y:barY,w:barW,h:barH,passed:false});
}

if(stepCount%2===0){
starsList.push({x:W/2,y:-98,taken:false});
}

if(score>=15&&stepCount%3===1){
const gy=-65;
const minX=WALL+BALL_R*2.8;
const maxX=W-WALL-BALL_R*2.8;
if(maxX>minX+24){
for(let attempt=0;attempt<10;attempt++){
const gx=minX+Math.random()*(maxX-minX);
if(isSafeGreenSpot(gx,gy,22)){
greens.push({x:gx,y:gy,size:22});
break;
}
}
}
}

return 190;
}

function spawnScatter(x,y,c,count,speed){
for(let i=0;i<count;i++){
const a=(Math.PI*2/count)*i+(Math.random()-0.5)*0.25;
const v=speed*(0.65+Math.random()*0.5);
particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c,r:2+Math.random()*2});
}
}

function addScorePopup(x,y,txt){
floats.push({x,y,txt,life:1});
}

function startGame(){
document.getElementById("start-screen").classList.add("hd");
document.getElementById("over-screen").classList.add("hd");
document.getElementById("pause-screen").classList.add("hd");
document.getElementById("shop-screen").classList.add("hd");
score=0;
resetGameState();
st="play";
lastT=0;
initAudio();
beep(580,.07,"triangle",0.1);
startBGM();
}

function togglePause(){
if(st==="play"){
st="pause";
stopBGM();
document.getElementById("pause-screen").classList.remove("hd");
}else if(st==="pause"){
st="play";
lastT=0;
startBGM();
document.getElementById("pause-screen").classList.add("hd");
}
}

function openMenu(){
st="menu";
stopBGM();
resetGameState();
document.getElementById("over-screen").classList.add("hd");
document.getElementById("pause-screen").classList.add("hd");
document.getElementById("shop-screen").classList.add("hd");
document.getElementById("start-screen").classList.remove("hd");
syncLB(0);
}

const wrap=document.getElementById("wrap");
wrap.addEventListener("pointerdown",e=>{
if(e.target.closest("button")||e.target.closest(".overlay")||e.target.closest(".hud-left")||st!=="play")return;
side=1-side;
targetX=side===0?WALL+BALL_R:W-WALL-BALL_R;
switching=true;
trailStampTimer=0;
trails.push({x:ballX,y:BALL_Y,r:BALL_R*0.92,life:0.85,color:SKINS[curSkin].glow});
beep(side===1?640:520,.05,"triangle",0.1);
});

function gameOver(){
if(st==="over")return;
st="over";
stopBGM();
shake=14;
beep(135,.3,"sawtooth",0.14);
spawnScatter(ballX,BALL_Y,SKINS[curSkin].core,24,180);
if(score>best){
best=score;
try{localStorage.setItem("sw_best",best);}catch(e){}
}
updStars();
document.getElementById("end-score").innerText=score;
document.getElementById("end-best").innerText=best;
setTimeout(()=>{
document.getElementById("over-screen").classList.remove("hd");
syncLB(score);
},480);
}

function drawPuffy3DStar(x,y,r){
ctx.save();
ctx.translate(x,y);

ctx.save();
ctx.translate(0,3.5);
ctx.beginPath();
for(let i=0;i<10;i++){
const rad=i%2===0?r*1.04:r*0.56;
const a=i*Math.PI/5-Math.PI/2;
const px=Math.cos(a)*rad,py=Math.sin(a)*rad;
if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.closePath();
ctx.fillStyle="rgba(15,23,42,0.16)";
ctx.fill();
ctx.restore();

const grd=ctx.createRadialGradient(-r*0.28,-r*0.32,r*0.12,0,0,r*1.15);
grd.addColorStop(0,"#fef08a");
grd.addColorStop(0.45,"#facc15");
grd.addColorStop(1,"#eab308");

ctx.beginPath();
for(let i=0;i<10;i++){
const rad=i%2===0?r*1.06:r*0.58;
const a=i*Math.PI/5-Math.PI/2;
const px=Math.cos(a)*rad,py=Math.sin(a)*rad;
if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
}
ctx.closePath();
ctx.fillStyle=grd;
ctx.fill();
ctx.lineJoin="round";
ctx.lineCap="round";
ctx.strokeStyle="#f59e0b";
ctx.lineWidth=3.2;
ctx.stroke();

ctx.fillStyle="rgba(255,255,255,0.55)";
ctx.beginPath();
ctx.ellipse(-r*0.12,-r*0.35,r*0.24,r*0.13,-0.35,0,Math.PI*2);
ctx.fill();

ctx.restore();
}

function drawTelegramBlock(x,y,w,h){
ctx.save();

ctx.shadowColor="rgba(37,99,235,0.26)";
ctx.shadowBlur=10;
ctx.shadowOffsetX=0;
ctx.shadowOffsetY=3;

ctx.fillStyle="#1d4ed8";
ctx.fillRect(x,y,w,h);

ctx.shadowColor="transparent";
ctx.shadowBlur=0;
ctx.shadowOffsetY=0;

ctx.fillStyle="#09090b";
ctx.fillRect(x+3,y+3,Math.max(0,w-6),Math.max(0,h-6));

ctx.restore();
}

function drawBorderedRect(x,y,w,h,fillCol,strokeCol,lineW){
ctx.fillStyle=fillCol;
ctx.fillRect(x,y,w,h);
ctx.strokeStyle=strokeCol;
ctx.lineWidth=lineW;
ctx.lineJoin="miter";
ctx.strokeRect(x,y,w,h);
}

function frame(now){
requestAnimationFrame(frame);
if(!lastT){lastT=now;return}
const rawDt=(now-lastT)/1000;
lastT=now;
const dt=Math.max(0.002,Math.min(0.032,Number.isFinite(rawDt)?rawDt:1/60));

updateBGM();
shake*=Math.pow(0.0005,dt);

ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,W,H);

ctx.save();
if(shake>0.25){
ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
}

ctx.fillStyle="#38bdf8";
ctx.fillRect(0,0,WALL,H);
ctx.fillRect(W-WALL,0,WALL,H);

if(st==="menu"){
const previewMove=260*dt;
spawnGap-=previewMove;
if(spawnGap<=0)spawnGap=spawnNextWave();
for(let i=bars.length-1;i>=0;i--){bars[i].y+=previewMove;if(bars[i].y>H+60)bars.splice(i,1)}
for(let i=greens.length-1;i>=0;i--){greens[i].y+=previewMove;if(greens[i].y>H+60)greens.splice(i,1)}
for(let i=starsList.length-1;i>=0;i--){starsList[i].y+=previewMove;if(starsList[i].y>H+60)starsList.splice(i,1)}
if(Math.sin(now*0.0022)>0.88&&!switching){
side=1-side;
targetX=side===0?WALL+BALL_R:W-WALL-BALL_R;
switching=true;
trailStampTimer=0;
trails.push({x:ballX,y:BALL_Y,r:BALL_R*0.92,life:0.85,color:SKINS[curSkin].glow});
}
}

if(st==="play"||st==="menu"){
const switchSpeed=1380*dt;
if(Math.abs(targetX-ballX)<=switchSpeed){
if(switching){
switching=false;
if(st==="play"){
shake=4.5;
beep(250,.035,"sine",0.07);
}
const edgeX=side===0?WALL+2:W-WALL-2;
for(let i=0;i<8;i++){
particles.push({
x:edgeX,
y:BALL_Y+(Math.random()-0.5)*12,
vx:(side===0?1:-1)*(30+Math.random()*75),
vy:(Math.random()-0.5)*90,
life:0.65,
c:"#475569",
r:1.8+Math.random()*1.8
});
}
}
ballX=targetX;
}else{
ballX+=Math.sign(targetX-ballX)*switchSpeed;
trailStampTimer+=dt;
if(trailStampTimer>=0.015){
trailStampTimer=0;
trails.push({x:ballX,y:BALL_Y,r:BALL_R*0.88,life:0.8,color:SKINS[curSkin].glow});
}
}

if(!switching){
dustTimer+=dt;
if(dustTimer>0.025){
dustTimer=0;
const wx=side===0?WALL+2:W-WALL-2;
particles.push({
x:wx+(side===0?Math.random()*4:-Math.random()*4),
y:BALL_Y+BALL_R*0.6,
vx:(side===0?1:-1)*(8+Math.random()*28),
vy:85+Math.random()*85,
life:0.7,
c:"#334155",
r:1.6+Math.random()*1.8
});
}
}
}

if(st==="play"){
const fallSpeed=getFallSpeed(score);
const dyStep=fallSpeed*dt;
spawnGap-=dyStep;
if(spawnGap<=0){
spawnGap=spawnNextWave();
}

for(let i=bars.length-1;i>=0;i--){
const b=bars[i];
b.y+=dyStep;
const nx=Math.max(b.x,Math.min(ballX,b.x+b.w));
const ny=Math.max(b.y,Math.min(BALL_Y,b.y+b.h));
const dx=ballX-nx,dy=BALL_Y-ny;
if(dx*dx+dy*dy<(BALL_R-2)*(BALL_R-2)){
gameOver();
break;
}
if(!b.passed&&b.y>BALL_Y+BALL_R){
b.passed=true;
score++;
document.getElementById("hud-best").innerText=Math.max(best,score);
}
if(b.y>H+60)bars.splice(i,1);
}

for(let i=greens.length-1;i>=0;i--){
const g=greens[i];
g.y+=dyStep;
const half=g.size/2;
const nx=Math.max(g.x-half,Math.min(ballX,g.x+half));
const ny=Math.max(g.y-half,Math.min(BALL_Y,g.y+half));
const dx=ballX-nx,dy=BALL_Y-ny;
if(dx*dx+dy*dy<(BALL_R-1.5)*(BALL_R-1.5)){
gameOver();
break;
}
if(g.y>H+60)greens.splice(i,1);
}

for(let i=starsList.length-1;i>=0;i--){
const s=starsList[i];
s.y+=dyStep;
if(!s.taken){
const dx=ballX-s.x,dy=BALL_Y-s.y;
if(dx*dx+dy*dy<(BALL_R+15)*(BALL_R+15)){
s.taken=true;
stars++;
updStars();
score+=1;
document.getElementById("hud-best").innerText=Math.max(best,score);
beep(920,.09,"sine",0.12);
addScorePopup(s.x,s.y-8,"+1");
}
}
if(s.y>H+60)starsList.splice(i,1);
}
}

if(st==="play"){
ctx.fillStyle="#0f172a";
ctx.font="900 44px Arial, sans-serif";
ctx.textAlign="center";
ctx.fillText(String(score),W/2,112);
}

for(let i=0;i<bars.length;i++){
const b=bars[i];
drawTelegramBlock(b.x,b.y,b.w,b.h);
}

for(let i=0;i<greens.length;i++){
const g=greens[i],half=g.size/2;
drawBorderedRect(g.x-half,g.y-half,g.size,g.size,"#09090b","#22c55e",3);
}

for(let i=0;i<starsList.length;i++){
if(!starsList[i].taken)drawPuffy3DStar(starsList[i].x,starsList[i].y,13);
}

for(let i=trails.length-1;i>=0;i--){
const tr=trails[i];
tr.life-=4.6*dt;
if(tr.life<=0){trails.splice(i,1);continue}
ctx.save();
ctx.globalAlpha=Math.max(0,Math.min(1,tr.life*0.42));
ctx.fillStyle=tr.color;
ctx.beginPath();
ctx.arc(tr.x,tr.y,Math.max(2,tr.r*tr.life),0,Math.PI*2);
ctx.fill();
ctx.restore();
}

for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx*dt;
p.y+=p.vy*dt;
p.life-=2.0*dt;
if(p.life<=0){particles.splice(i,1);continue}
ctx.save();
ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
ctx.fillStyle=p.c;
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();
ctx.restore();
}

const sk=SKINS[curSkin];
if(st!=="over"){
ctx.fillStyle=sk.glow;
ctx.beginPath();
ctx.arc(ballX,BALL_Y,BALL_R+3.5,0,Math.PI*2);
ctx.fill();

ctx.fillStyle=sk.core;
ctx.beginPath();
ctx.arc(ballX,BALL_Y,BALL_R,0,Math.PI*2);
ctx.fill();
}

for(let i=floats.length-1;i>=0;i--){
const f=floats[i];
f.y-=48*dt;
f.life-=1.6*dt;
if(f.life<=0){floats.splice(i,1);continue}
ctx.save();
ctx.globalAlpha=Math.max(0,Math.min(1,f.life));
ctx.fillStyle="#64748b";
ctx.font="700 16px Arial, sans-serif";
ctx.textAlign="center";
ctx.fillText(f.txt,f.x,f.y);
ctx.restore();
}

ctx.restore();
}

syncLB(0);
requestAnimationFrame(frame);

function shareScore(){
const txt=`⚡ رکورد من در بازی SWITCH شد: ${best} امتیاز!\nمی‌تونی با سرعت عملت رکوردم رو بزنی؟ 👇\n\n🎮 بازی‌های بیشتر و چالش‌های روزانه در کانال ما:\n${CHANNEL_ID} | ${CHANNEL_URL}`;
const shareUrl=`https://ble.ir/share/url?url=${encodeURIComponent(BOT_LINK)}&text=${encodeURIComponent(txt)}`;
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink)Bale.WebApp.openLink(shareUrl);
else if(navigator.share)navigator.share({title:"SWITCH PRO",text:txt,url:BOT_LINK}).catch(()=>{});
else window.open(shareUrl,"_blank");
}
</script>
<script src="https://tapi.bale.ai/miniapp.js" async onload="syncLB(0)"></script>
