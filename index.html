<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SWITCH PRO</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;font-family:Tahoma,sans-serif}
html,body{width:100%;height:100%;background:#0f172a;color:#0f172a;overflow:hidden}
#wrap{position:relative;width:100%;max-width:480px;height:100%;margin:0 auto;background:#ffffff;overflow:hidden;touch-action:manipulation}
canvas{display:block;width:100%;height:100%;transform:translateZ(0);will-change:transform}
.hud{position:absolute;top:0;left:0;right:0;height:54px;background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-bottom:1px solid rgba(15,23,42,.08);padding:0 16px;display:flex;justify-content:space-between;align-items:center;z-index:10;pointer-events:none}
.hud-left{font-size:13px;color:#0f172a;font-weight:bold;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:10px}
.hud-btns{display:flex;gap:8px;pointer-events:auto}
.icon-btn{width:35px;height:35px;border-radius:50%;background:#f1f5f9;border:1px solid #cbd5e1;color:#0f172a;font-size:14px;display:flex;justify-content:center;align-items:center;cursor:pointer}
.shop-fab{position:absolute;top:66px;left:22px;width:46px;height:46px;border-radius:14px;background:#ffffff;border:2px solid #06b6d4;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;z-index:12;font-size:18px;box-shadow:0 4px 12px rgba(6,182,212,.22)}
.shop-fab span{font-size:9px;color:#0284c7;font-weight:bold;margin-top:1px}
.overlay{position:absolute;inset:0;background:rgba(255,255,255,.94);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:18px;z-index:25;overflow-y:auto}
#start-screen{background:radial-gradient(circle at center,rgba(255,255,255,.72),rgba(241,245,249,.92));backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.hd{display:none!important}
.logo{font-size:32px;font-weight:900;color:#0f172a;margin-bottom:6px;letter-spacing:1.5px}
.logo span{color:#ef4444}
.sub{font-size:12px;color:#475569;margin-bottom:14px;text-align:center}
.card{width:100%;max-width:350px;background:#ffffff;border:1.5px solid #e2e8f0;border-radius:18px;padding:12px;margin-bottom:14px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
.card-title{font-size:13px;font-weight:bold;color:#0284c7;margin-bottom:8px;display:flex;justify-content:space-between}
.lb-list{max-height:185px;overflow-y:auto}
.lb-row{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:10px;margin-bottom:5px;background:#f8fafc;font-size:13px;color:#0f172a}
.lb-row.me{background:rgba(6,182,212,.14);border:1px solid #06b6d4}
.lb-user{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.av{width:28px;height:28px;border-radius:50%;display:flex;justify-content:center;align-items:center;font-weight:900;font-size:12px;color:#fff;flex-shrink:0;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.lb-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:bold}
.btn{width:100%;max-width:350px;padding:14px;border:none;border-radius:14px;font-size:15px;font-weight:900;cursor:pointer;margin-bottom:9px}
.btn-play{background:linear-gradient(135deg,#06b6d4,#0284c7);color:#fff;box-shadow:0 4px 16px rgba(6,182,212,.35)}
.btn-share{background:#f1f5f9;color:#0f172a;font-size:13px;border:1px solid #cbd5e1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:350px;margin-bottom:12px}
.stat{background:#f8fafc;border:1.5px solid #e2e8f0;border-radius:14px;padding:10px;text-align:center}
.skins-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:350px;margin-bottom:14px}
.sk-item{background:#f8fafc;border:2px solid #e2e8f0;border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer}
.sk-item.active{border-color:#06b6d4;background:rgba(6,182,212,.1)}
.sk-dot{width:30px;height:30px;border-radius:50%;margin:0 auto 6px}
.brand-tag{margin-top:6px;padding:6px 14px;border-radius:20px;background:#f8fafc;border:1px solid #e2e8f0;font-size:11px;color:#64748b;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.brand-tag b{color:#0284c7;font-family:sans-serif;direction:ltr}
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 16px;border-radius:12px;font-size:12px;font-weight:bold;z-index:50;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="wrap">
<div id="toast"></div>
<div class="hud">
<div class="hud-left" onclick="openMenu()"><span>🏆 <span id="hud-best">0</span></span><span style="color:#d97706">⭐ <span id="hud-stars">0</span></span></div>
<div style="font-size:13px;font-weight:900;color:#0284c7;letter-spacing:1px">SWITCH</div>
<div class="hud-btns">
<button class="icon-btn" id="btn-snd" onclick="toggleSound()">🔊</button>
<button class="icon-btn" id="btn-pause" onclick="togglePause()">⏸</button>
</div>
</div>

<div class="shop-fab" id="shop-btn" onclick="openShop()">🛒<span id="fab-stars">0⭐</span></div>
<canvas id="cv"></canvas>

<div class="overlay" id="start-screen">
<div class="logo">⚡ SWITCH<span>!</span></div>
<div class="sub">با ضربه زدن بین دیوارهای نئونی جابه‌جا شو، ستاره بگیر و از موانع بگریز!</div>
<div class="card">
<div class="card-title"><span>🏆 برترین رکوردهای بازیکنان</span><span id="my-rank" style="color:#0f172a;font-size:11px"></span></div>
<div class="lb-list" id="lb-start">در حال دریافت...</div>
</div>
<button class="btn btn-play" onclick="startGame()">شروع بازی</button>
<button class="btn btn-share" onclick="openShop()">🛒 فروشگاه رنگ توپ‌ها (⭐ <span id="menu-stars">0</span>)</button>
<div class="brand-tag" onclick="openChannel()">🎮 اختصاصی کانال <b>@gamee_balee</b></div>
</div>

<div class="overlay hd" id="shop-screen">
<div class="logo" style="font-size:24px">🛒 فروشگاه توپ‌ها</div>
<div class="sub">موجودی ستاره شما: <b style="color:#d97706" id="shop-stars">0</b> ⭐</div>
<div class="skins-grid" id="skins-grid"></div>
<button class="btn btn-play" onclick="closeShop()">بازگشت</button>
</div>

<div class="overlay hd" id="pause-screen">
<div class="logo" style="color:#0284c7">توقف بازی</div>
<button class="btn btn-play" onclick="togglePause()">▶️ ادامه بازی</button>
<button class="btn btn-share" onclick="openMenu()">🏠 منو و رده‌بندی</button>
</div>

<div class="overlay hd" id="over-screen">
<div class="logo" style="color:#ef4444">GAME OVER</div>
<div class="stats">
<div class="stat"><div style="font-size:24px;font-weight:900;color:#0284c7" id="end-score">0</div><div style="font-size:11px;color:#64748b">امتیاز</div></div>
<div class="stat"><div style="font-size:24px;font-weight:900;color:#16a34a" id="end-best">0</div><div style="font-size:11px;color:#64748b">رکورد شما</div></div>
</div>
<div class="card">
<div class="card-title"><span>🏆 جدول نفرات برتر</span></div>
<div class="lb-list" id="lb-over"></div>
</div>
<button class="btn btn-play" onclick="startGame()">🔄 بازی مجدد</button>
<button class="btn btn-share" onclick="shareScore()">📤 کل‌کل و ارسال رکورد</button>
<div class="brand-tag" onclick="openChannel()">🎮 اختصاصی کانال <b>@gamee_balee</b></div>
</div>
</div>

<script>
const DB="https://kido-db.mohammadahmadi0007.workers.dev/switch_lb.json";
const BOT_LINK="https://ble.ir/switch_game_bot";
const CHANNEL_ID="@gamee_balee";
const CHANNEL_URL="https://ble.ir/gamee_balee";

function openChannel(){
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink)Bale.WebApp.openLink(CHANNEL_URL);
else window.open(CHANNEL_URL,"_blank");
}

let usr={id:localStorage.getItem("sw_uid")||("u_"+Math.floor(1e5+Math.random()*9e5)),name:"بازیکن مهمان",photo:""};
localStorage.setItem("sw_uid",usr.id);
try{
const raw=(location.hash||"")+"&"+(location.search||"");
const m=raw.match(/(?:tgWebAppData|baleWebAppData)=([^&]+)/);
if(m&&m[1]){const u=JSON.parse(new URLSearchParams(decodeURIComponent(m[1])).get("user"));if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله";if(u.photo_url)usr.photo=u.photo_url}}
if(window.Bale&&Bale.WebApp){Bale.WebApp.ready();Bale.WebApp.expand();const u=Bale.WebApp.initDataUnsafe&&Bale.WebApp.initDataUnsafe.user;if(u&&u.id){usr.id="b_"+u.id;usr.name=[u.first_name,u.last_name].filter(Boolean).join(" ")||"کاربر بله";if(u.photo_url)usr.photo=u.photo_url}}
}catch(e){}

const GRADS=["linear-gradient(135deg,#06b6d4,#3b82f6)","linear-gradient(135deg,#ec4899,#8b5cf6)","linear-gradient(135deg,#f59e0b,#ef4444)","linear-gradient(135deg,#10b981,#059669)","linear-gradient(135deg,#6366f1,#a855f7)"];
function avHtml(p){
let s=0;for(let i=0;i<p.id.length;i++)s+=p.id.charCodeAt(i);
const bg=GRADS[s%GRADS.length],ch=(p.name||"؟").trim().charAt(0);
return p.photo?`<div class="av" style="background:${bg}"><img src="${p.photo}" onerror="this.parentNode.innerText='${ch}'"></div>`:`<div class="av" style="background:${bg}">${ch}</div>`;
}

let best=parseInt(localStorage.getItem("sw_best")||"0",10);
let stars=parseInt(localStorage.getItem("sw_stars")||"0",10);
let owned=JSON.parse(localStorage.getItem("sw_owned")||"[0]");
let curSkin=parseInt(localStorage.getItem("sw_skin")||"0",10);
let lb=[];

const SKINS=[
{name:"کلاسیک",cost:0,core:"#0f172a",glow:"#ef4444"},
{name:"فیروزه",cost:15,core:"#0891b2",glow:"#22d3ee"},
{name:"بنفش",cost:30,core:"#581c87",glow:"#c084fc"},
{name:"آتشین",cost:50,core:"#991b1b",glow:"#f97316"},
{name:"زمرد",cost:75,core:"#065f46",glow:"#34d399"},
{name:"طلایی",cost:100,core:"#1e293b",glow:"#facc15"}
];

function updStars(){
localStorage.setItem("sw_stars",stars);
document.getElementById("hud-stars").innerText=stars;
document.getElementById("fab-stars").innerText=stars+"⭐";
document.getElementById("menu-stars").innerText=stars;
document.getElementById("shop-stars").innerText=stars;
}
updStars();
document.getElementById("hud-best").innerText=best;
function toast(m){const t=document.getElementById("toast");t.innerText=m;t.style.opacity="1";setTimeout(()=>t.style.opacity="0",2000)}

function openShop(){renderShop();document.getElementById("shop-screen").classList.remove("hd")}
function closeShop(){document.getElementById("shop-screen").classList.add("hd")}
function renderShop(){
updStars();
document.getElementById("skins-grid").innerHTML=SKINS.map((sk,i)=>{
const ok=owned.includes(i),act=curSkin===i;
return `<div class="sk-item ${act?'active':''}" onclick="pickSkin(${i})">
<div class="sk-dot" style="background:${sk.core};box-shadow:0 0 12px ${sk.glow}"></div>
<div style="font-size:12px;font-weight:bold;margin-bottom:3px">${sk.name}</div>
<div style="font-size:11px;color:${act?'#0284c7':ok?'#16a34a':'#d97706'}">${act?'فعال ✅':ok?'انتخاب':sk.cost+' ⭐'}</div>
</div>`;
}).join("");
}
function pickSkin(i){
if(owned.includes(i)){curSkin=i;localStorage.setItem("sw_skin",i);beep(620,.08);renderShop();toast("توپ "+SKINS[i].name+" فعال شد!")}
else if(stars>=SKINS[i].cost){
stars-=SKINS[i].cost;owned.push(i);curSkin=i;
localStorage.setItem("sw_owned",JSON.stringify(owned));localStorage.setItem("sw_skin",i);
beep(800,.15);renderShop();toast("توپ "+SKINS[i].name+" خریداری شد!");
}else toast("ستاره کافی نداری! ⭐");
}

async function syncLB(sc){
try{
const r=await fetch(DB);let d=await r.json();if(!Array.isArray(d))d=[];
const i=d.findIndex(x=>x.id===usr.id);
if(i>-1){if(sc>d[i].score)d[i].score=sc;if(usr.name!=="بازیکن مهمان")d[i].name=usr.name;if(usr.photo)d[i].photo=usr.photo;if(d[i].score>best){best=d[i].score;localStorage.setItem("sw_best",best)}}
else if(sc>0){d.push({id:usr.id,name:usr.name,photo:usr.photo,score:sc})}
d.sort((a,b)=>b.score-a.score);d=d.slice(0,25);lb=d;
if(sc>0)await fetch(DB,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
}catch(e){}
document.getElementById("hud-best").innerText=best;
const rk=lb.findIndex(x=>x.id===usr.id);
document.getElementById("my-rank").innerText=rk>-1?`رتبه شما: #${rk+1}`:"";
const h=lb.length?lb.slice(0,10).map((p,idx)=>`<div class="lb-row ${p.id===usr.id?'me':''}"><div class="lb-user"><span style="width:22px;font-weight:900">${idx===0?'🥇':idx===1?'🥈':idx===2?'🥉':'#'+(idx+1)}</span>${avHtml(p)}<span class="lb-name">${p.name}</span></div><strong style="color:#0284c7;margin-right:6px">${p.score}</strong></div>`).join(""):"<div style='text-align:center;color:#64748b;font-size:12px;padding:10px'>اولین نفر باش و رکورد بزن!</div>";
document.getElementById("lb-start").innerHTML=h;document.getElementById("lb-over").innerHTML=h;
}

let snd=true,ac=null,nextNoteTime=0,beatStep=0,bgmRunning=false;
const BASS_NOTES=[130.8,130.8,164.8,146.8,130.8,130.8,196.0,164.8];
const LEAD_NOTES=[523.2,0,659.2,784.0,659.2,0,587.3,523.2];

function initAudio(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume()}
function beepAt(f,d,t,v,when){
if(!snd||document.hidden||!ac)return;
try{
const o=ac.createOscillator(),g=ac.createGain();
o.type=t;o.frequency.value=f;
g.gain.setValueAtTime(v,when);
g.gain.exponentialRampToValueAtTime(.001,when+d);
o.connect(g);g.connect(ac.destination);o.start(when);o.stop(when+d);
}catch(e){}
}
function beep(f,d,t="sine",v=0.14){if(!snd||document.hidden)return;initAudio();beepAt(f,d,t,v,ac.currentTime)}
function startBGM(){if(!snd||document.hidden)return;initAudio();bgmRunning=true;nextNoteTime=ac.currentTime+0.05}
function stopBGM(){bgmRunning=false}
function updateBGM(){
if(!bgmRunning||!snd||st!=="play"||document.hidden||!ac)return;
while(nextNoteTime<ac.currentTime+0.15){
const b=BASS_NOTES[beatStep%8],l=LEAD_NOTES[beatStep%8];
beepAt(b,0.14,"triangle",0.045,nextNoteTime);
if(l>0&&beatStep%2===0)beepAt(l,0.12,"sine",0.03,nextNoteTime);
nextNoteTime+=0.19;beatStep++;
}
}
function toggleSound(){
snd=!snd;document.getElementById("btn-snd").innerText=snd?"🔊":"🔇";
if(snd&&st==="play"&&!document.hidden)startBGM();else stopBGM();
}

function handleVisibility(){
if(document.hidden){stopBGM();if(ac&&ac.state==="running")ac.suspend().catch(()=>{})}
else{lastT=0;if(snd&&st==="play"){if(ac&&ac.state==="suspended")ac.resume().catch(()=>{});startBGM()}}
}
document.addEventListener("visibilitychange",handleVisibility);
window.addEventListener("pagehide",()=>{stopBGM();if(ac&&ac.state==="running")ac.suspend().catch(()=>{})});
window.addEventListener("blur",()=>{stopBGM();if(ac&&ac.state==="running")ac.suspend().catch(()=>{})});
window.addEventListener("focus",()=>{lastT=0;if(!document.hidden&&snd&&st==="play"){if(ac&&ac.state==="suspended")ac.resume().catch(()=>{});startBGM()}});

const cv=document.getElementById("cv"),ctx=cv.getContext("2d",{alpha:false});
let W=360,H=640,DPR=1,WALL=13,BALL_R=14,BALL_Y=460;
function resize(){
W=window.innerWidth>480?480:window.innerWidth;H=window.innerHeight;
DPR=Math.min(2.5,window.devicePixelRatio||1);
cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
ctx.setTransform(DPR,0,0,DPR,0,0);
BALL_Y=H*0.72;
}
window.addEventListener("resize",resize);resize();

let st="menu",score=0,side=0,ballX=WALL+BALL_R,targetX=WALL+BALL_R,switching=false;
let ribbons=[],blocks=[],spinners=[],squares=[],pickups=[],parts=[],floats=[];
let shake=0,wallPulseL=0,wallPulseR=0,spawnT=0,dustT=0,lastPattern=-1,lastT=0,smoothDt=1/60;

function resetWorld(){
side=0;ballX=WALL+BALL_R;targetX=WALL+BALL_R;switching=false;
ribbons=[];blocks=[];spinners=[];squares=[];pickups=[];parts=[];floats=[];
shake=0;wallPulseL=0;wallPulseR=0;spawnT=0.15;lastPattern=-1;
}
resetWorld();

// سیستم تولید ۸ الگوی کاملاً متنوع و غیرتکراری برای مسیر بازی
function spawnPattern(){
const minX=WALL,maxX=W-WALL,playW=maxX-minX;
const h=22;

// انتخاب الگوی جدید که دقیقاً با الگوی قبلی یکسان نباشد
const maxPat=score<4?3:score<10?6:8;
let pat=Math.floor(Math.random()*maxPat);
if(pat===lastPattern)pat=(pat+1)%maxPat;
lastPattern=pat;

const pickSide=Math.random()>0.5;

if(pat===0){
// الگوی ۱: بلوک یک‌طرفه با عرض تصادفی + ستاره در مسیر فرار
const w=playW*(0.42+Math.random()*0.28);
if(pickSide){
blocks.push({x:minX,y:-35,w,h,passed:false});
if(Math.random()<0.65)pickups.push({x:maxX-BALL_R-18,y:-35,hit:false});
}else{
blocks.push({x:maxX-w,y:-35,w,h,passed:false});
if(Math.random()<0.65)pickups.push({x:minX+BALL_R+18,y:-35,hit:false});
}
return 0.72;
}

if(pat===1){
// الگوی ۲: تله چسبیده به دیوار (مکعب سبز نئونی یا بلوک کوتاه روی ریل حرکت توپ)
const sqSz=26;
if(pickSide){
squares.push({x:minX+sqSz/2+2,y:-40,sz:sqSz,passed:false});
if(Math.random()<0.7)pickups.push({x:W/2,y:-40,hit:false});
}else{
squares.push({x:maxX-sqSz/2-2,y:-40,sz:sqSz,passed:false});
if(Math.random()<0.7)pickups.push({x:W/2,y:-40,hit:false});
}
return 0.65;
}

if(pat===2){
// الگوی ۳: دروازه تنگ (دو بلوک از چپ و راست هم‌زمان و یک شکاف در وسط یا کنار)
const gapW=BALL_R*4.4;
const leftW=(playW-gapW)*(0.2+Math.random()*0.6);
const rightW=playW-gapW-leftW;
blocks.push({x:minX,y:-35,w:leftW,h,passed:false});
blocks.push({x:maxX-rightW,y:-35,w:rightW,h,passed:true});
pickups.push({x:minX+leftW+gapW/2,y:-35,hit:false});
return 0.82;
}

if(pat===3){
// الگوی ۴: زیگزاگ دوتایی سریع (رفت و برگشت فوری)
const w1=playW*(0.52+Math.random()*0.15);
const w2=playW*(0.52+Math.random()*0.15);
if(pickSide){
blocks.push({x:minX,y:-35,w:w1,h,passed:false});
blocks.push({x:maxX-w2,y:-175,w:w2,h,passed:false});
pickups.push({x:W/2,y:-105,hit:false});
}else{
blocks.push({x:maxX-w1,y:-35,w:w1,h,passed:false});
blocks.push({x:minX,y:-175,w:w2,h,passed:false});
pickups.push({x:W/2,y:-105,hit:false});
}
return 1.15;
}

if(pat===4){
// الگوی ۵: بلوک با میله چرخان زیر آن (دقیقاً مشابه ثانیه 0:08 ویدیو)
const w=playW*(0.46+Math.random()*0.16);
const dir=Math.random()>0.5?1:-1;
if(pickSide){
blocks.push({x:minX,y:-35,w,h,passed:false});
spinners.push({x:minX+w*0.55,y:-35+h+2,len:48,ang:0.5,vr:dir*(2.8+Math.random()*1.2)});
}else{
blocks.push({x:maxX-w,y:-35,w,h,passed:false});
spinners.push({x:maxX-w*0.55,y:-35+h+2,len:48,ang:-0.5,vr:dir*(2.8+Math.random()*1.2)});
}
pickups.push({x:W/2,y:-115,hit:false});
return 0.92;
}

if(pat===5){
// الگوی ۶: میدان مین مکعب‌های سبز نئونی با چیدمان تصادفی در عرض صفحه
const count=score>18?3:2;
const step=playW/(count+1);
for(let i=1;i<=count;i++){
const jitter=(Math.random()-0.5)*(step*0.45);
const yOff=(i%2===0)?-35:-95;
squares.push({x:minX+step*i+jitter,y:yOff,sz:24,passed:i===1?false:true});
}
pickups.push({x:minX+playW*(0.2+Math.random()*0.6),y:-145,hit:false});
return 0.95;
}

if(pat===6){
// الگوی ۷: پروانه چرخان بزرگ در مرکز مسیر (باید از کناره‌ها رد شوی)
const dir=Math.random()>0.5?1:-1;
spinners.push({x:W/2,y:-65,len:playW*0.34,ang:0,vr:dir*2.6,double:true});
pickups.push({x:pickSide?minX+BALL_R+16:maxX-BALL_R-16,y:-65,hit:false});
return 0.9;
}

// الگوی ۸: ترکیب بلوک کوتاه و مکعب سبز در سمت مخالف (تله تغییر مسیر)
const w=playW*0.45;
if(pickSide){
blocks.push({x:minX,y:-35,w,h,passed:false});
squares.push({x:maxX-24,y:-130,sz:25,passed:false});
pickups.push({x:W/2,y:-82,hit:false});
}else{
blocks.push({x:maxX-w,y:-35,w,h,passed:false});
squares.push({x:minX+24,y:-130,sz:25,passed:false});
pickups.push({x:W/2,y:-82,hit:false});
}
return 1.05;
}

function ringBoom(x,y,c){
const count=22;
for(let i=0;i<count;i++){
const a=(Math.PI*2/count)*i;
const spd=175;
parts.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,l:1,c,sz:3.4,ring:true});
}
}

function addFloat(x,y,txt,col="#0f172a"){floats.push({x,y,txt,col,l:1})}

function startGame(){
document.getElementById("start-screen").classList.add("hd");
document.getElementById("over-screen").classList.add("hd");
document.getElementById("pause-screen").classList.add("hd");
score=0;resetWorld();st="play";lastT=0;initAudio();beep(580,.08);startBGM();
}
function togglePause(){
if(st==="play"){st="pause";stopBGM();document.getElementById("pause-screen").classList.remove("hd")}
else if(st==="pause"){st="play";lastT=0;startBGM();document.getElementById("pause-screen").classList.add("hd")}
}
function openMenu(){st="menu";stopBGM();resetWorld();document.getElementById("over-screen").classList.add("hd");document.getElementById("pause-screen").classList.add("hd");document.getElementById("start-screen").classList.remove("hd");syncLB(0)}

const wrap=document.getElementById("wrap");
wrap.addEventListener("pointerdown",e=>{
if(e.target.closest("button")||e.target.closest(".overlay")||e.target.closest(".hud-left")||e.target.closest(".shop-fab")||st!=="play")return;
const prevX=ballX;
side=1-side;
targetX=side===0?WALL+BALL_R:W-WALL-BALL_R;
switching=true;
ribbons.push({x0:prevX,x1:prevX,y:BALL_Y,l:1,active:true});
beep(side===1?640:520,.055,"triangle",0.12);
});

function triggerFail(){
st="over";stopBGM();shake=15;beep(140,.35,"sawtooth");
ringBoom(ballX,BALL_Y,SKINS[curSkin].core);
if(score>best){best=score;localStorage.setItem("sw_best",best)}
document.getElementById("end-score").innerText=score;document.getElementById("end-best").innerText=best;
setTimeout(()=>{document.getElementById("over-screen").classList.remove("hd");syncLB(score)},520);
}

function drawStar(x,y,r){
ctx.save();ctx.translate(x,y);ctx.lineJoin="round";
const pts=[];
for(let i=0;i<10;i++){const rad=i%2===0?r:r*0.52,a=i*Math.PI/5-Math.PI/2;pts.push({x:Math.cos(a)*rad,y:Math.sin(a)*rad})}
ctx.fillStyle="#facc15";ctx.strokeStyle="#facc15";ctx.lineWidth=3.5;
ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<10;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.closePath();ctx.fill();ctx.stroke();
ctx.fillStyle="#f59e0b";
for(let i=0;i<10;i+=2){const pO=pts[i],pR=pts[(i+1)%10];ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(pO.x,pO.y);ctx.lineTo(pR.x,pR.y);ctx.closePath();ctx.fill()}
ctx.fillStyle="#fef08a";
[0,8].forEach(idx=>{const pO=pts[idx],pL=pts[(idx+9)%10];ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(pL.x*0.88,pL.y*0.88);ctx.lineTo(pO.x*0.88,pO.y*0.88);ctx.closePath();ctx.fill()});
ctx.restore();
}

function checkSegHit(x1,y1,x2,y2){
const l2=(x2-x1)*(x2-x1)+(y2-y1)*(y2-y1);
if(l2===0)return false;
let t=((ballX-x1)*(x2-x1)+(BALL_Y-y1)*(y2-y1))/l2;
t=Math.max(0,Math.min(1,t));
const px=x1+t*(x2-x1),py=y1+t*(y2-y1);
const dx=ballX-px,dy=BALL_Y-py;
return dx*dx+dy*dy<(BALL_R+2)*(BALL_R+2);
}

function loop(now){
requestAnimationFrame(loop);
if(!lastT){lastT=now;return}
const rawDt=Math.min(0.033,Math.max(0.004,(now-lastT)/1000));
lastT=now;
smoothDt+=(rawDt-smoothDt)*0.25;
const dt=smoothDt;

updateBGM();
shake*=Math.pow(0.0002,dt);
wallPulseL=Math.max(0,wallPulseL-5*dt);
wallPulseR=Math.max(0,wallPulseR-5*dt);

ctx.fillStyle="#ffffff";
ctx.fillRect(0,0,W,H);

ctx.save();
if(shake>0.3)ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);

const wL=WALL+wallPulseL*4;
const wallGrdL=ctx.createLinearGradient(0,0,wL,0);
wallGrdL.addColorStop(0,"#0284c7");wallGrdL.addColorStop(1,"#38bdf8");
ctx.fillStyle=wallGrdL;ctx.fillRect(0,0,wL,H);

const wR=WALL+wallPulseR*4;
const wallGrdR=ctx.createLinearGradient(W-wR,0,W,0);
wallGrdR.addColorStop(0,"#38bdf8");wallGrdR.addColorStop(1,"#0284c7");
ctx.fillStyle=wallGrdR;ctx.fillRect(W-wR,0,wR,H);

if(st==="menu"){
spawnT-=dt;
if(spawnT<=0)spawnT=spawnPattern();
for(let i=blocks.length-1;i>=0;i--){blocks[i].y+=270*dt;if(blocks[i].y>H+60)blocks.splice(i,1)}
for(let i=squares.length-1;i>=0;i--){squares[i].y+=270*dt;if(squares[i].y>H+60)squares.splice(i,1)}
for(let i=spinners.length-1;i>=0;i--){spinners[i].y+=270*dt;spinners[i].ang+=spinners[i].vr*dt;if(spinners[i].y>H+80)spinners.splice(i,1)}
for(let i=pickups.length-1;i>=0;i--){pickups[i].y+=270*dt;if(pickups[i].y>H+60)pickups.splice(i,1)}
if(Math.sin(now*0.0025)>0.86&&!switching){
const prevX=ballX;side=1-side;targetX=side===0?WALL+BALL_R:W-WALL-BALL_R;switching=true;
ribbons.push({x0:prevX,x1:prevX,y:BALL_Y,l:1,active:true});
}
}

if(st==="play"||st==="menu"){
const spdX=2550*dt;
if(Math.abs(targetX-ballX)<=spdX){
if(switching){
switching=false;
if(ribbons.length)ribbons[ribbons.length-1].active=false;
if(st==="play"){
shake=5.5;
if(side===0)wallPulseL=1;else wallPulseR=1;
beep(260,.04,"sine",0.08);
}
const hitX=side===0?WALL+2:W-WALL-2;
for(let i=0;i<10;i++){
parts.push({x:hitX,y:BALL_Y+(Math.random()-0.5)*14,vx:(side===0?1:-1)*(40+Math.random()*90),vy:(Math.random()-0.5)*110,l:0.7,c:"#64748b",sz:2+Math.random()*2});
}
}
ballX=targetX;
}else{
ballX+=Math.sign(targetX-ballX)*spdX;
if(ribbons.length&&ribbons[ribbons.length-1].active){
ribbons[ribbons.length-1].x1=ballX;
}
}

if(!switching){
dustT+=dt;
if(dustT>0.025){
dustT=0;
const wx=side===0?WALL+2:W-WALL-2;
parts.push({x:wx+(side===0?Math.random()*4:-Math.random()*4),y:BALL_Y+BALL_R*0.65,vx:(side===0?1:-1)*(10+Math.random()*35),vy:90+Math.random()*90,l:0.75,c:"#475569",sz:1.8+Math.random()*2});
}
}
}

if(st==="play"){
const fallSpd=340+Math.min(260,score*4.2);
spawnT-=dt;
if(spawnT<=0){
const delayFactor=Math.max(0.62,1-score*0.007);
spawnT=spawnPattern()*delayFactor;
}

for(let i=blocks.length-1;i>=0;i--){
const b=blocks[i];
b.y+=fallSpd*dt;
const cx=Math.max(b.x,Math.min(ballX,b.x+b.w));
const cy=Math.max(b.y,Math.min(BALL_Y,b.y+b.h));
const dx=ballX-cx,dy=BALL_Y-cy;
if(dx*dx+dy*dy<(BALL_R-2)*(BALL_R-2)){
triggerFail();break;
}
if(!b.passed&&b.y>BALL_Y+BALL_R){
b.passed=true;
score++;
document.getElementById("hud-best").innerText=Math.max(best,score);
}
if(b.y>H+60)blocks.splice(i,1);
}

for(let i=spinners.length-1;i>=0;i--){
const sp=spinners[i];
sp.y+=fallSpd*dt;
sp.ang+=sp.vr*dt;
const x1=sp.double?sp.x-Math.cos(sp.ang)*sp.len:sp.x;
const y1=sp.double?sp.y-Math.sin(sp.ang)*sp.len:sp.y;
const x2=sp.x+Math.cos(sp.ang)*sp.len;
const y2=sp.y+Math.sin(sp.ang)*sp.len;
if(checkSegHit(x1,y1,x2,y2)){
triggerFail();break;
}
if(sp.y>H+100)spinners.splice(i,1);
}

for(let i=squares.length-1;i>=0;i--){
const sq=squares[i];
sq.y+=fallSpd*dt;
const half=sq.sz/2;
const cx=Math.max(sq.x-half,Math.min(ballX,sq.x+half));
const cy=Math.max(sq.y-half,Math.min(BALL_Y,sq.y+half));
const dx=ballX-cx,dy=BALL_Y-cy;
if(dx*dx+dy*dy<(BALL_R-1)*(BALL_R-1)){
triggerFail();break;
}
if(!sq.passed&&sq.y>BALL_Y+BALL_R){
sq.passed=true;
score++;
document.getElementById("hud-best").innerText=Math.max(best,score);
}
if(sq.y>H+60)squares.splice(i,1);
}

for(let i=pickups.length-1;i>=0;i--){
const p=pickups[i];
p.y+=fallSpd*dt;
if(!p.hit){
const dx=ballX-p.x,dy=BALL_Y-p.y;
if(dx*dx+dy*dy<(BALL_R+15)*(BALL_R+15)){
p.hit=true;
stars++;updStars();score+=1;
document.getElementById("hud-best").innerText=Math.max(best,score);
beep(960,.1,"sine",0.14);
addFloat(p.x,p.y-10,"+1","#0f172a");
}
}
if(p.y>H+60)pickups.splice(i,1);
}
}

if(st==="play"){
ctx.fillStyle="#0f172a";
ctx.font="900 46px Tahoma";
ctx.textAlign="center";
ctx.fillText(score,W/2,120);
}

for(let i=spinners.length-1;i>=0;i--){
const sp=spinners[i];
ctx.save();ctx.translate(sp.x,sp.y);ctx.rotate(sp.ang);
ctx.fillStyle="#0f172a";
if(sp.double){
ctx.beginPath();ctx.roundRect(-sp.len,-3.5,sp.len*2,7,3.5);ctx.fill();
ctx.fillStyle="#ef4444";ctx.beginPath();ctx.arc(0,0,5,0,6.28);ctx.fill();
}else{
ctx.beginPath();ctx.roundRect(0,-3.5,sp.len,7,3.5);ctx.fill();
}
ctx.restore();
}

for(let i=0;i<blocks.length;i++){
const b=blocks[i];
ctx.fillStyle="#0f172a";
ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.fill();
ctx.strokeStyle="#2563eb";ctx.lineWidth=3;
ctx.beginPath();ctx.roundRect(b.x,b.y,b.w,b.h,4);ctx.stroke();
}

for(let i=0;i<squares.length;i++){
const sq=squares[i],half=sq.sz/2;
ctx.fillStyle="#0f172a";
ctx.fillRect(sq.x-half,sq.y-half,sq.sz,sq.sz);
ctx.strokeStyle="#22c55e";ctx.lineWidth=3;
ctx.strokeRect(sq.x-half,sq.y-half,sq.sz,sq.sz);
}

for(let i=0;i<pickups.length;i++){
if(!pickups[i].hit)drawStar(pickups[i].x,pickups[i].y,13);
}

const sk=SKINS[curSkin];
for(let i=ribbons.length-1;i>=0;i--){
const rb=ribbons[i];
if(!rb.active)rb.l-=2.8*dt;
if(rb.l<=0){ribbons.splice(i,1);continue}
const grd=ctx.createLinearGradient(rb.x0,rb.y,rb.x1,rb.y);
grd.addColorStop(0,"rgba(239,68,68,0)");
grd.addColorStop(1,sk.glow);
ctx.save();
ctx.globalAlpha=rb.l*0.42;
ctx.strokeStyle=grd;
ctx.lineWidth=BALL_R*1.55;
ctx.lineCap="round";
ctx.beginPath();ctx.moveTo(rb.x0,rb.y);ctx.lineTo(rb.x1,rb.y);ctx.stroke();
ctx.restore();
}

for(let i=parts.length-1;i>=0;i--){
const pt=parts[i];
pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;
pt.l-=(pt.ring?1.6:1.9)*dt;
if(pt.l<=0){parts.splice(i,1);continue}
ctx.fillStyle=pt.c;ctx.globalAlpha=pt.l;
ctx.beginPath();ctx.arc(pt.x,pt.y,pt.sz,0,6.28);ctx.fill();
}
ctx.globalAlpha=1;

if(st!=="over"){
ctx.save();
ctx.shadowColor=sk.glow;ctx.shadowBlur=16;
ctx.fillStyle=sk.glow;
ctx.beginPath();ctx.arc(ballX,BALL_Y,BALL_R+3,0,6.28);ctx.fill();
ctx.restore();

ctx.fillStyle=sk.core;
ctx.beginPath();ctx.arc(ballX,BALL_Y,BALL_R,0,6.28);ctx.fill();
}

for(let i=floats.length-1;i>=0;i--){
const f=floats[i];
f.y-=55*dt;f.l-=1.5*dt;
if(f.l<=0){floats.splice(i,1);continue}
ctx.globalAlpha=f.l;ctx.fillStyle=f.col;
ctx.font="bold 19px Tahoma";ctx.textAlign="center";
ctx.fillText(f.txt,f.x,f.y);
}
ctx.globalAlpha=1;
ctx.restore();
}
syncLB(0);requestAnimationFrame(loop);

function shareScore(){
const txt=`⚡ رکورد من در بازی SWITCH شد: ${best} امتیاز!\nمی‌تونی با سرعت عملت رکوردم رو بزنی؟ 👇\n\n🎮 بازی‌های بیشتر و چالش‌های روزانه در کانال ما:\n${CHANNEL_ID} | ${CHANNEL_URL}`;
const shareUrl=`https://ble.ir/share/url?url=${encodeURIComponent(BOT_LINK)}&text=${encodeURIComponent(txt)}`;
if(window.Bale&&Bale.WebApp&&Bale.WebApp.openLink)Bale.WebApp.openLink(shareUrl);
else if(navigator.share)navigator.share({title:"SWITCH PRO",text:txt,url:BOT_LINK}).catch(()=>{});
else window.open(shareUrl,"_blank");
}
</script>
</body>
